# Runs the API against a MongoDB server. The API container is built from
# src/DotNetApiPi.Api/Dockerfile and is configured (via the Storage__*
# environment variables) to use the Mongo storage provider instead of the
# default embedded SQLite database.
#
# CREDENTIALS: the MongoDB root credentials are parameterized through the
# MONGO_USER / MONGO_PASSWORD variables (see .env.example; copy it to .env
# and adjust — .env is gitignored). The values below are the built-in
# defaults used when .env is absent.
#
# SECURITY NOTE: authentication is enabled, but the default credentials are
# well known and the ports are exposed on the host. This is intentional for
# a local development scaffold only — never run this configuration on a
# network other than loopback/localhost without changing MONGO_PASSWORD.
services:
  api:
    build:
      context: .
      dockerfile: src/DotNetApiPi.Api/Dockerfile
    container_name: dotnet-api-pi
    ports:
      # Maps the host's 8090 to the container's 8080 (the port the API is
      # configured to listen on in the Dockerfile). Adjust if 8090 is taken.
      - "8090:8080"
    environment:
      # Development keeps the Swagger UI (and developer-friendly error
      # details) enabled; the API listens on 8080 inside the container
      # (see src/DotNetApiPi.Api/Dockerfile).
      ASPNETCORE_ENVIRONMENT: Development
      Storage__Provider: mongo
      # The root user is created in the admin database by
      # MONGO_INITDB_ROOT_*, hence authSource=admin.
      Storage__MongoConnectionString: "mongodb://${MONGO_USER:-dotnetapipi}:${MONGO_PASSWORD:-secret-dev}@mongo:27017?authSource=admin"
      Storage__MongoDatabaseName: dotnet_api_pi
    depends_on:
      mongo:
        condition: service_healthy
    # The API exposes an /health endpoint; probing it also verifies that the
    # composition root's startup (persistence initialization) completed.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: dotnet-api-pi-mongo
    # Root credentials (audit finding F-20): MONGO_INITDB_ROOT_* creates the
    # admin-DB root user on first initialization. Override via .env.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dotnetapipi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret-dev}
    # The host port is mapped to 27018 so the scaffold keeps working even
    # when a local MongoDB already occupies 27017. Inside the compose
    # network the API always reaches Mongo at mongo:27017.
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    # The healthcheck authenticates with the same credentials (the previous
    # unauthenticated ping is no longer valid).
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u '${MONGO_USER:-dotnetapipi}' -p '${MONGO_PASSWORD:-secret-dev}' --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
