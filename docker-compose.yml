# Runs the API against a MongoDB server. The API container is built from
# src/DotNetApiPi.Api/Dockerfile and is configured (via the Storage__*
# environment variables) to use the Mongo storage provider instead of the
# default embedded SQLite database.
#
# SECURITY NOTE: the MongoDB container runs with NO authentication and its
# data directory is a named volume. This is intentional for a local
# development scaffold only — never run this configuration (exposed port,
# no auth) on a network other than loopback/localhost.
services:
  api:
    build:
      context: .
      dockerfile: src/DotNetApiPi.Api/Dockerfile
    container_name: dotnet-api-pi
    ports:
      # Maps the host's 8090 to the container's 8080 (the port the API is
      # configured to listen on in the Dockerfile). Adjust if 8090 is taken.
      - "8090:8080"
    environment:
      Storage__Provider: mongo
      Storage__MongoConnectionString: "mongodb://mongo:27017"
      Storage__MongoDatabaseName: dotnet_api_pi
    depends_on:
      mongo:
        condition: service_healthy
    # The API exposes an /health endpoint; probing it also verifies that the
    # composition root's startup (persistence initialization) completed.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: dotnet-api-pi-mongo
    # No authentication is configured — see the SECURITY NOTE above.
    # The host port is mapped to 27018 so the scaffold keeps working even
    # when a local MongoDB already occupies 27017. Inside the compose
    # network the API always reaches Mongo at mongo:27017.
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
