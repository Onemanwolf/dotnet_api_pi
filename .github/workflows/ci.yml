name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotNetApiPi.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build DotNetApiPi.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test DotNetApiPi.sln -c Release --no-build
